services:
  email-delivery:
    mem_limit: 1g
    build:
      context: .
      target: production
    depends_on:
      - email-delivery-bull-db
    env_file:
      - .env
    networks:
      - email-delivery-network
    restart: unless-stopped

  email-delivery-bull-db:
    mem_limit: 512m
    image: redis:latest
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--maxmemory",
        "384mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - email-delivery-bull-db-data:/data
    networks:
      - email-delivery-network
    restart: unless-stopped

networks:
  email-delivery-network:
    driver: bridge

volumes:
  email-delivery-bull-db-data:
